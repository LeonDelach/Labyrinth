<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Labyrinthe</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      #game-layout {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        padding: 16px;
      }

      #dessin {
        width: 400px;
        height: 400px;
        border: 1px solid #333;
        background: orange;
      }

      #renderCanvas {
        width: 400px;
        height: 400px;
        border: 1px solid #333;
        touch-action: none;
      }

      button {
        display: block;
        margin-top: 12px;
        padding: 8px 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game-layout">
      <div>
        <canvas id="dessin" width="400" height="400"></canvas>
        <button id="restart">Restart</button>
      </div>
      <canvas id="renderCanvas" width="400" height="400"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.js"></script>

    <script src="./src/model/utils/Wall.js"></script>
    <script src="./src/model/utils/Hole.js"></script>
    <script src="./src/model/utils/Arrival.js"></script>
    <script src="./src/model/utils/Marble.js"></script>
    <script src="./src/model/presets/playground.js"></script>
    <script src="./src/model/Board.js"></script>
    <script src="./src/core/Game.js"></script>
    <script src="./src/render/CanvasRenderer.js"></script>
    <script src="./src/render/BabylonRenderer.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
