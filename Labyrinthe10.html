<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Labyrinthe</title>

  <script src="../hand.minified-1.2.js"></script>
  <script src="../babylon.js"></script>
  <script src="../cannon.min.js"></script>
  <script src="../oimo.min.js"></script>
  <script src="../csg.js"></script>
  <script src="./labyrinth-core.js"></script>
  <script src="./labyrinth-3d.js"></script>

  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #renderCanvas {
      width: 400px;
      height: 400px;
      touch-action: none;
    }

    .right {
      text-align: right;
    }

    .sliders {
      padding: 5px;
    }

    input[type=range] {
      position: relative;
      top: 3px;
    }

    #sliders {
      position: absolute;
      top: 20px;
      left: 20px;
      opacity: 0.5;
    }
  </style>
</head>
<body onload="load2D(); load3D();">
  <canvas id="dessin" width="400" height="400"></canvas>
  <canvas id="renderCanvas"></canvas>
  <p id="show"></p>
  <input type="submit" value="Restart" onclick="restart(); load2D(); load3D();">
</body>
</html>
